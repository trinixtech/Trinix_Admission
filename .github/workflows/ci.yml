name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Pest on MySQL 8, Pint, migrations)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: admission_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: admission_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, redis, intl, zip, pcntl, bcmath
          coverage: none
      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Live-safe migrations
        run: php tools/check-migrations.php
      - name: Migrations run on MySQL
        run: php artisan migrate --force && php artisan access:sync
      - name: Tests (Pest)
        run: vendor/bin/pest

  frontend:
    name: Frontend (lint, types, Vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx vue-tsc --noEmit
      - run: npm test
      - run: npx vite build

  e2e:
    name: End-to-end walk-through (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund && npx vite build && npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          cp .env.example .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/; s#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --class=DemoSeeder
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --host 127.0.0.1 --port 8000 > storage/logs/serve.log 2>&1 &
          until curl -sf http://127.0.0.1:8000/up; do sleep 1; done
      - name: Run the walk-through
        run: node tests/e2e/walkthrough.mjs
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: storage/e2e
